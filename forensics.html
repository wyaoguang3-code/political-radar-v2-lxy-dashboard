<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>事件解構 · 脈絡透明化｜台中輿情鑑識</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
:root{--bg:#0b1020;--panel:#121935;--panel2:#0c1228;--bd:#2a335f;--tx:#e8ecff;--mut:#b9c3f2;--dim:#6b7494;
--acc:#5a79ff;--red:#ff5d6c;--yel:#ffc24b;--grn:#3ddc97;--org:#ff9f43}
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang TC','Microsoft JhengHei',sans-serif;
background:var(--bg);color:var(--tx);margin:0;padding:16px;line-height:1.5}
.wrap{max-width:1280px;margin:0 auto}
h1{font-size:21px;margin:0 0 2px;display:flex;align-items:center;gap:10px}
h1 .sub{font-size:12px;color:var(--mut);font-weight:400}
.meta{color:var(--dim);font-size:12px;margin-bottom:14px}
.panel{background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:14px;min-width:0}
.sec-title{font-size:14px;font-weight:700;margin:0 0 10px;display:flex;align-items:center;gap:6px;color:var(--tx)}
.sec-title .hint{font-weight:400;font-size:11px;color:var(--dim)}
.ev-sort{display:inline-flex;gap:0;border:1px solid var(--bd);border-radius:7px;overflow:hidden}
.ev-sort-btn{font:600 11px/1 inherit;color:var(--mut);background:transparent;border:0;border-left:1px solid var(--bd);padding:4px 9px;cursor:pointer;transition:.12s}
.ev-sort-btn:first-child{border-left:0}
.ev-sort-btn:hover{color:var(--tx);background:rgba(255,255,255,.05)}
.ev-sort-btn.active{color:#0b1020;background:var(--acc)}
/* 預警雷達 */
.watch-strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.watch-card{flex:0 0 250px;background:var(--panel2);border:1px solid #3d2a2a;border-left:3px solid var(--org);
border-radius:10px;padding:10px 12px;font-size:12px;transition:border-color .12s}
.watch-card:hover{border-color:var(--org)}
.watch-card.wc-open{border-color:var(--org);box-shadow:0 0 0 1px var(--org);background:#1a1410}
.watch-card b{font-size:13px}
.watch-card .wc-merged{font-size:9.5px;color:var(--acc);border:1px solid #3a4a8a;border-radius:99px;padding:0 6px;margin-left:6px;white-space:nowrap}
/* 議題地圖熱點 */
.map-panel{margin:14px 0}
#incidentMap{height:420px;border-radius:12px;border:1px solid var(--bd);overflow:hidden;background:#0c1228}
.leaflet-container{background:#0c1228;font-family:inherit}
.map-popup{font-size:12px;color:#0b1020;min-width:180px}
.map-popup b{font-size:13px}
.map-popup .mp-meta{color:#3a4366;margin:3px 0}
.map-popup .mp-go{display:inline-block;margin-top:5px;background:var(--acc);color:#fff;border-radius:6px;padding:3px 9px;font-weight:700;cursor:pointer;text-decoration:none}
.map-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--mut);margin:8px 2px 0}
.map-legend .ml-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle}
.map-unplaced{font-size:11px;color:var(--dim);margin:8px 2px 0;line-height:1.6}
.map-unplaced .mu-chip{display:inline-block;border:1px solid var(--bd);border-radius:99px;padding:1px 8px;margin:2px 3px 0;cursor:pointer;color:var(--mut)}
.map-unplaced .mu-chip:hover{border-color:var(--acc);color:var(--tx)}
.watch-card .wc-meta{color:var(--mut);margin:4px 0}
.watch-card .wc-note{color:var(--org);font-size:11px;margin-top:6px}
.watch-card a{color:var(--mut);text-decoration:none;font-size:11px}
.watch-card a:hover{color:var(--acc)}
/* 版面 */
.layout{display:grid;grid-template-columns:330px 1fr;gap:14px;margin-top:14px}
@media(max-width:900px){.layout{grid-template-columns:1fr}}
/* 事件清單 */
.ev-card{background:var(--panel2);border:1px solid var(--bd);border-radius:10px;padding:11px 12px;margin-bottom:9px;
cursor:pointer;transition:border-color .12s,transform .08s}
.ev-card:hover{border-color:var(--acc);transform:translateY(-1px)}
.ev-card.active{border-color:var(--acc);background:#16203f;box-shadow:0 0 0 1px var(--acc)}
.ev-card .name{font-weight:700;font-size:14px;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.ev-card .name .score{font-size:11px;color:var(--dim);white-space:nowrap}
.ev-row{display:flex;gap:6px;align-items:center;margin-top:5px;flex-wrap:wrap}
.chip{font-size:10.5px;padding:1px 8px;border-radius:99px;border:1px solid var(--bd);color:var(--mut);white-space:nowrap}
.chip.topic{border-color:#3a4a8a;color:#9db1ff}
.chip.fp-高度協同跡象{border-color:var(--red);color:var(--red)}
.chip.fp-媒體議程推動型{border-color:var(--yel);color:var(--yel)}
.chip.fp-自然發酵型{border-color:var(--grn);color:var(--grn)}
.spark{margin-top:7px}
.ev-card .mini{color:var(--dim);font-size:11px;margin-top:4px}
/* 詳情 */
.det-head{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;margin-bottom:4px}
.det-head h2{font-size:19px;margin:0}
.statline{display:flex;gap:14px;flex-wrap:wrap;color:var(--mut);font-size:12.5px;margin:8px 0 2px}
.statline b{color:var(--tx)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
@media(max-width:1000px){.grid2{grid-template-columns:1fr}}
.sub-panel{background:var(--panel2);border:1px solid var(--bd);border-radius:10px;padding:12px}
table{width:100%;border-collapse:collapse;font-size:12px}
td,th{padding:4px 6px;text-align:left;vertical-align:top;border-bottom:1px solid #1a2241}
th{color:var(--dim);font-weight:600;font-size:11px}
a.tl{color:var(--tx);text-decoration:none;border-bottom:1px dotted #44508a}
a.tl:hover{color:var(--acc);border-color:var(--acc)}
.sev-紅燈{color:var(--red)}.sev-黃燈{color:var(--yel)}.sev-綠燈{color:var(--grn)}
.lean-泛藍{color:#7da2ff}.lean-泛綠{color:#5fd9a2}.lean-中性{color:#cfd6f5}.lean-聚合{color:#9aa3c7}.lean-通訊社,.lean-公共{color:#b9c3f2}
.kv{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px dashed #1a2241}
.kv span:first-child{color:var(--mut)}
.indic{margin:7px 0;padding:8px 10px;background:#0e1530;border:1px solid #1f2950;border-radius:8px}
.indic .ir{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600}
.indic .ev{color:var(--mut);font-size:11.5px;margin-top:2px}
.bar-bg{height:5px;background:#1a2241;border-radius:99px;margin-top:5px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--grn),var(--yel) 55%,var(--red))}
.gauge{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.gauge .num{font-size:30px;font-weight:800}
.gauge .lbl{font-size:13px;font-weight:700}
.gauge .desc{font-size:11.5px;color:var(--mut)}
.lean-bar{display:flex;height:16px;border-radius:6px;overflow:hidden;margin:8px 0;border:1px solid var(--bd)}
.lean-bar div{height:100%}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--mut);margin-top:4px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
/* 逆轉 / 手冊 */
.rev-box{border-left:3px solid var(--grn);background:#0e1d18;border-radius:8px;padding:10px 12px;margin-top:12px;font-size:13px}
.rev-box.none{border-color:var(--dim);background:#10162e;color:var(--mut)}
.play-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-top:10px}
.play-col{background:var(--panel2);border:1px solid var(--bd);border-radius:10px;padding:11px}
.play-col h4{margin:0 0 7px;font-size:12.5px;color:var(--acc)}
.play-col ul{margin:0;padding-left:16px;font-size:12px;color:var(--tx)}
.play-col li{margin-bottom:6px}
.note-box{background:#1a1430;border:1px solid #3a2a6a;border-radius:8px;padding:10px 12px;margin-top:10px;font-size:12.5px}
.note-box b{color:#c0a8ff}
.play-grid{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.op-card{background:#0e1530;border:1px solid #28315a;border-radius:8px;padding:9px 10px;margin-bottom:8px}
.op-card .oc-a{font-weight:700;font-size:12.5px;color:#cdd6ff;margin-bottom:5px;line-height:1.4}
.op-row{display:flex;gap:6px;font-size:11.5px;line-height:1.55;margin-top:3px}
.op-row .k{flex:0 0 56px;color:var(--dim);font-weight:600}
.op-row .v{flex:1;min-width:0}
.op-row.how .v{color:#dfe6ff}.op-row.cost .v{color:#ffcf8f}.op-row.impact .v{color:#9fe6c0}.op-row.risk .v{color:#ff9ba6}
.op-row.flow .v{color:#b9c3f2}.op-row.say .v{color:#9fe6c0}.op-row.avoid .v{color:#ff9ba6}.op-row.who .v{color:#c9b8ff}
.op-row .k{flex:0 0 62px}
.chain{margin:6px 0 2px}
.chain-link{display:flex;padding:8px 2px;border-bottom:1px dashed #1c2547}
.chain-link:last-child{border-bottom:none}
.chain-body{flex:1;min-width:0}
.chain-title{font-size:11.5px;color:var(--acc);font-weight:700}
.chain-find{font-size:13px;color:var(--tx);font-weight:600;margin:2px 0}
.chain-ev{font-size:11.5px;color:var(--mut);line-height:1.5}
.chain-link3{padding:8px 2px;border-bottom:1px dashed #1c2547}
.chain-link3:last-child{border-bottom:none}
.chain-link3>summary{cursor:pointer;list-style:none;user-select:none}
.chain-link3>summary::-webkit-details-marker{display:none}
.chain-link3>summary:hover .cx-toggle{color:var(--acc)}
.cx-toggle{font-size:10.5px;color:var(--dim);font-weight:400}
.chain-link3[open]>summary .cx-toggle::after{content:' (收合)'}
.cx-wrap{margin:8px 0 4px;padding:10px 12px;background:#0c1228;border:1px solid #232c52;border-radius:8px}
.cx-h{font-size:12px;font-weight:700;color:var(--acc);margin-bottom:7px}
.cx-ul{margin:0;padding-left:16px;font-size:12px;line-height:1.65;color:var(--tx)}
.cx-ul li{margin-bottom:6px}
.cx-day{margin:4px 0;border-bottom:1px dashed #18203f}
.cx-day>summary{cursor:pointer;font-size:12px;color:var(--mut);padding:3px 0;font-weight:600}
.cx-day>summary:hover{color:var(--acc)}
.cx-rec{border-left:3px solid var(--acc);background:#0e1530;border-radius:8px;padding:9px 11px;margin-top:2px}
.cx-mode{font-size:14px;font-weight:800;margin-bottom:4px}
.cx-row{font-size:12px;line-height:1.55;margin-top:3px;color:var(--tx)}
.cx-row b{color:var(--mut);font-weight:600}
.cx-opt{margin-top:8px;font-size:12px;line-height:1.6;background:#1a1430;border:1px solid #3a2a6a;border-radius:8px;padding:8px 10px;color:#dcd2ff}
.cx-def{font-size:12.5px;line-height:1.7;color:var(--tx);background:#0e1530;border-left:3px solid var(--acc);border-radius:6px;padding:8px 11px}
.cx-miss{margin-top:5px;font-size:12px;line-height:1.55}
.cx-miss>b{color:var(--org)}
.cx-miss-why{color:var(--mut);margin-top:1px}
/* 事件客製化應對（針對本案，非通用模板） */
.tailored{background:linear-gradient(180deg,#15193a,#0e1430);border:1px solid #3a4690;border-radius:10px;padding:11px 13px;margin-bottom:11px}
.tl-cap{font-size:12px;font-weight:800;color:#ffd06b;letter-spacing:.3px;margin-bottom:9px}
.tl-trig{background:#2a1418;border:1px solid #7a2630;border-left:4px solid var(--red);border-radius:7px;padding:9px 11px;font-size:12.5px;line-height:1.6;color:#ffd9dd;margin-bottom:9px}
.tl-trig b{color:#ff8e98}
.tl-trig-b{margin-top:4px;color:#ffe6e9}
.tl-h{font-size:12px;font-weight:700;color:var(--acc);margin:9px 0 4px}
.tl-ul{margin:0;padding-left:17px;font-size:12.5px;line-height:1.65}
.tl-ul li{margin:5px 0;color:#dfe6ff}
.tl-ul.prev li{color:#a9e9c8}
.tl-generic-lbl{font-size:10.5px;color:var(--dim);font-weight:600;margin:9px 0 3px;border-top:1px dashed #2a335f;padding-top:6px}
/* 非危機議題的「聲量經營」客製（綠色系，與危機紅色系區隔） */
.tailored.leverage{background:linear-gradient(180deg,#12231a,#0e1812);border-color:#2e6b4a}
.tailored.leverage .tl-cap{color:#7fe6b0}
.tl-h.amber{color:var(--org)}
.tl-ul.amp li{color:#bfe0ff}
.tl-ul.guard li{color:#ffcf9f}
.prop{margin:6px 0 4px}
.prop-step{background:#0e1530;border:1px solid #28315a;border-radius:7px;padding:7px 10px;font-size:12px}
.prop-step .prop-k{font-size:10.5px;color:var(--acc);font-weight:700;margin-bottom:2px}
.prop-step .prop-v{color:var(--tx);line-height:1.45}
.prop-arrow{text-align:center;font-size:11px;color:var(--org);padding:3px 0}
.pp-note{font-size:11px;color:var(--dim);line-height:1.55;margin:4px 0 2px;padding:5px 8px;background:#0e1530;border-radius:6px}
.ptt-art{background:#0e1530;border:1px solid #28315a;border-radius:8px;padding:7px 10px;margin-bottom:6px}
.ptt-art[open]{border-color:var(--acc)}
.ptt-art>summary{cursor:pointer;list-style:none;font-size:12px;line-height:1.5}
.ptt-art>summary::-webkit-details-marker{display:none}
.ptt-meta{color:var(--mut);font-weight:700;white-space:nowrap}
.ptt-art>summary:hover .cx-toggle{color:var(--acc)}
.ptt-art[open]>summary .cx-toggle::after{content:' (收合)'}
.ptt-art .cm-list{margin-top:7px;max-height:340px}
.amp-why{font-size:10.5px;color:#7fd0a0;margin-top:2px}
.amp-snip{font-size:10.5px;color:var(--mut);margin-top:1px}
.cm-narr{background:#1d1530;border-left:3px solid var(--org);border-radius:6px;padding:8px 10px;font-size:12.5px;color:#ffd6a3;line-height:1.5}
.cm-earliest{background:#0e1530;border:1px solid #2a335f;border-radius:8px;padding:8px 10px;margin-top:8px;font-size:12px}
.cm-earliest .tag{background:var(--red);color:#fff;font-size:10px;padding:1px 7px;border-radius:99px;font-weight:700;margin-right:4px}
.cm-details{margin-top:8px}
.cm-details summary{cursor:pointer;color:var(--acc);font-size:12.5px;font-weight:600;padding:4px 0;user-select:none}
.cm-list{margin-top:6px;max-height:420px;overflow-y:auto;padding-right:4px}
.cm-row{padding:7px 2px;border-bottom:1px dashed #1c2547}
.cm-row:last-child{border-bottom:none}
.cm-meta{font-size:11px;color:var(--mut)}
.cm-text{font-size:12.5px;color:var(--tx);margin-top:2px;line-height:1.45;word-break:break-word}
.pp-stats{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;margin:6px 0}
.pp-up{color:var(--grn);font-weight:700}.pp-down{color:var(--red);font-weight:700}.pp-arrow{color:var(--mut)}
.pp-ratio{color:#ffd6a3;font-weight:700}.pp-peak{color:var(--acc)}
.pp-bars{display:flex;align-items:flex-end;gap:2px;height:54px;margin-top:6px}
.pp-bar{flex:1;min-width:6px;display:flex;flex-direction:column;justify-content:flex-end;height:100%;cursor:pointer;border-radius:2px}
.pp-bar:hover{background:rgba(90,121,255,.14)}
.pp-bar.sel{background:rgba(90,121,255,.22);box-shadow:inset 0 0 0 1px var(--acc)}
.pp-fill{background:linear-gradient(180deg,var(--red),var(--org));border-radius:2px 2px 0 0;min-height:3px}
.pp-lbl{font-size:8px;color:var(--dim);text-align:center;margin-top:1px}
.pp-axis{font-size:10.5px;color:var(--dim);margin-top:2px}
.phase-tl{display:flex;gap:0;margin:10px 0 4px;font-size:11px;flex-wrap:wrap}
.phase-step{flex:1;min-width:110px;padding:7px 9px;background:var(--panel2);border:1px solid var(--bd);position:relative}
.phase-step:first-child{border-radius:8px 0 0 8px}.phase-step:last-child{border-radius:0 8px 8px 0}
.phase-step b{display:block;font-size:12px;margin-bottom:2px}
.phase-step.p-ign b{color:var(--red)}.phase-step.p-peak b{color:var(--yel)}.phase-step.p-rev b{color:var(--grn)}.phase-step.p-lat b{color:var(--mut)}
.caveats{margin-top:18px;color:var(--dim);font-size:11px;line-height:1.7}
.hour-hist{display:flex;align-items:flex-end;gap:1px;height:42px;margin-top:6px}
.hour-hist .hh-col{flex:1;display:flex;align-items:flex-end;height:100%;cursor:pointer;border-radius:2px}
.hour-hist .hh-col:hover{background:rgba(90,121,255,.14)}
.hour-hist .hh-col.sel{background:rgba(90,121,255,.30);box-shadow:inset 0 0 0 1px var(--acc)}
.hour-hist .hh-col.sel .hh-bar{opacity:1}
.hour-hist .hh-col.hh-static{cursor:default}
.hour-hist .hh-col.hh-static:hover{background:transparent}
.hour-hist .hh-bar{width:100%;background:var(--acc);opacity:.85;border-radius:2px 2px 0 0;min-height:1px}
.hour-lbl{display:flex;justify-content:space-between;font-size:9.5px;color:var(--dim)}
/* 可點擊圖表：點某天/某時段看該時段新聞 */
rect.day-hit{fill:transparent}
rect.day-hit:hover{fill:rgba(90,121,255,.13)}
rect.day-hit.sel{fill:rgba(90,121,255,.26);stroke:var(--acc);stroke-width:1.4}
.chart-hint{font-size:11px;color:var(--acc);margin:4px 0 0}
.life-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 0 2px;flex-wrap:wrap}
.life-title{font-size:12.5px;font-weight:700;color:var(--mut)}
.life-toggle{display:inline-flex;border:1px solid var(--bd);border-radius:7px;overflow:hidden}
.lt-btn{font:600 11px/1 inherit;color:var(--mut);background:transparent;border:0;border-left:1px solid var(--bd);padding:4px 9px;cursor:pointer}
.lt-btn:first-child{border-left:0}
.lt-btn:hover{background:rgba(255,255,255,.05);color:var(--tx)}
.lt-btn.active{color:#0b1020;background:var(--acc)}
/* 聲量背離面板 */
.sup-panel .sup-head{display:flex;align-items:center;gap:12px;padding:7px 11px;border-radius:8px;margin:2px 0 8px;flex-wrap:wrap}
.sup-lvl{font-size:15px;font-weight:800}
.sup-idx{font-size:12px;color:var(--mut)}.sup-idx b{color:var(--tx);font-size:14px}
.sup-tag{font-size:10px;color:var(--org);border:1px solid var(--org);border-radius:99px;padding:1px 7px;margin-left:auto}
.sup-gate{font-size:11px;color:var(--org);background:rgba(214,158,46,.1);border-radius:7px;padding:6px 9px;margin-bottom:8px}
.sup-rows{display:flex;flex-direction:column;gap:7px}
.sup-row{border:1px solid #2a335f;border-radius:8px;padding:7px 9px;background:#0e1430}
.sup-row.sup-dim{opacity:.5}
.sup-rt{font-size:12px;font-weight:700;color:var(--mut);display:flex;align-items:center;gap:7px;margin-bottom:4px}
.sup-conf{font-size:9.5px;border-radius:99px;padding:1px 6px;border:1px solid var(--bd);color:var(--dim)}
.sup-conf.c-high{color:#9db1ff;border-color:#3a4a8a}
.sup-na{font-size:9.5px;color:var(--dim)}
.sup-rb{display:flex;align-items:center;gap:8px}
.sup-bar{flex:0 0 84px;height:7px;border-radius:4px;background:#1b2245;overflow:hidden}
.sup-fill{display:block;height:100%}
.sup-ev{font-size:11px;color:var(--mut);line-height:1.4}
.sup-note{font-size:10.5px;color:var(--dim);margin-top:8px;line-height:1.5;border-top:1px dashed #2a335f;padding-top:7px}
.ev-supflag{font-size:9.5px;border-radius:99px;padding:0 6px;margin-left:6px;border:1px solid var(--org);color:var(--org)}

svg text{font-family:inherit}

<body>
<div class="wrap">
  <h1>🔬 事件解構 · 脈絡透明化 <span class="sub">台中輿情事件鑑識（盧秀燕基底）</span></h1>
  <div class="meta" id="meta">載入中…</div>

  <div class="panel" id="watchPanel" style="border-left:3px solid var(--org)">
    <div class="sec-title">⚠️ 預警雷達 <span class="hint">正處「潛伏期」的微弱訊號 — 今天的 2-3 則，可能是明天的引爆點。點卡片展開全部報導與應對</span></div>
    <div class="watch-strip" id="watchStrip"></div>
    <div id="watchDetail"></div>
  </div>

  <div class="panel map-panel">
    <div class="sec-title">🗺️ 議題地圖熱點 <span class="hint">以亮點標示事件在台中的發生位置；點亮點看事件、再點「查看完整解構」跳到該事件</span></div>
    <div id="incidentMap"></div>
    <div class="map-legend">
      <span><span class="ml-dot" style="background:#ff5d6c"></span>紅＝高負面/危機</span>
      <span><span class="ml-dot" style="background:#ffc24b"></span>黃＝爭議/質疑</span>
      <span><span class="ml-dot" style="background:#3ddc97"></span>綠＝正向/中性</span>
      <span>⚠ 預警雷達事件＝空心點　｜　圈越大＝聲量越高</span>
    </div>
    <div id="mapUnplaced" class="map-unplaced"></div>
  </div>

  <div class="layout">
    <div>
      <div class="sec-title" style="margin:2px 0 8px">📂 事件檔案
        <span class="ev-sort">
          <button class="ev-sort-btn active" data-sort="new" onclick="setEvSort('new')">最新</button>
          <button class="ev-sort-btn" data-sort="old" onclick="setEvSort('old')">最舊</button>
          <button class="ev-sort-btn" data-sort="hot" onclick="setEvSort('hot')">最熱</button>
        </span>
        <span class="hint" id="evSortHint">依引爆日期，最新在最上面</span></div>
      <div id="evList"></div>
    </div>
    <div id="detail" class="panel"></div>
  </div>

  <div class="caveats" id="caveats"></div>
</div>

<script>
let DATA=null, CUR=0;
const $=id=>document.getElementById(id);
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// 把文字裡的網址轉成精簡可點連結（顯示縮短、href 完整；其餘字照 esc）
function linkify(s){
  return String(s||'').split(/(https?:\/\/[^\s，、。；：）)」』】\]＞>]+)/g).map(p=>{
    if(/^https?:\/\//.test(p)){
      let label=p.replace(/^https?:\/\//,'').replace(/^www\./,'');
      if(label.length>30) label=label.slice(0,28)+'…';
      return `<a class="tl" href="${esc(p)}" target="_blank" rel="noopener">${esc(label)} ↗</a>`;
    }
    return esc(p);
  }).join('');
}
const LEAN_COLORS={'泛藍':'#5b8def','泛綠':'#3ddc97','中性':'#aab4d8','聚合':'#5f6a8f','通訊社':'#8fa0d8','公共':'#8fa0d8','地方':'#7d88ad','其他':'#4a5575'};
function renderCards(arr){
  if(!arr||!arr.length) return '<div class="empty" style="font-size:11.5px">—</div>';
  return arr.map(c=>{
    if(typeof c==='string') return `<div class="op-card"><div class="oc-a">▸ ${esc(c)}</div></div>`;
    return `<div class="op-card"><div class="oc-a">▸ ${esc(c.a)}</div>
      ${c.how?`<div class="op-row how"><span class="k">怎麼做</span><span class="v">${linkify(c.how)}</span></div>`:''}
      ${c.flow?`<div class="op-row flow"><span class="k">流程/時序</span><span class="v">${linkify(c.flow)}</span></div>`:''}
      ${c.say?`<div class="op-row say"><span class="k">該講/聚焦</span><span class="v">${linkify(c.say)}</span></div>`:''}
      ${c.avoid?`<div class="op-row avoid"><span class="k">不該講/避免</span><span class="v">${linkify(c.avoid)}</span></div>`:''}
      ${c.who?`<div class="op-row who"><span class="k">人員/帶誰</span><span class="v">${linkify(c.who)}</span></div>`:''}
      ${c.cost?`<div class="op-row cost"><span class="k">成本</span><span class="v">${linkify(c.cost)}</span></div>`:''}
      ${c.impact?`<div class="op-row impact"><span class="k">預期影響</span><span class="v">${linkify(c.impact)}</span></div>`:''}
      ${c.risk?`<div class="op-row risk"><span class="k">風險注意</span><span class="v">${linkify(c.risk)}</span></div>`:''}
    </div>`;
  }).join('');
}
function pttSampleRows(samples){
  if(!samples||!samples.length) return '<div class="empty" style="font-size:11px;padding:4px 0">此篇暫無推文樣本（可能 0 推文或抓取當下無資料）</div>';
  return `<div class="cm-list">${samples.map(s=>`<div class="cm-row"><div class="cm-meta">${s.tag==='推'?'🟢 推':s.tag==='噓'?'🔴 噓':'⚪ →'} <b>${esc(s.uid)}</b> · ${esc(s.time)}</div><div class="cm-text">${esc(s.text)}</div></div>`).join('')}</div>`;
}
function pttArticleHtml(p){
  const tot=(p.push||0)+(p.boo||0)+(p.arrow||0), shown=(p.samples||[]).length;
  const capNote=(tot>shown)?`<div class="pp-note">本篇共 ${tot} 則推文，此處顯示有內文的 ${shown} 則${shown>=400?'（達 400 則上限，完整見原文）':'（少數純標記/已刪推文略過）'}；完整見 <a class="tl" href="${esc(p.url)}" target="_blank" rel="noopener">PTT 原文 ↗</a>。</div>`:'';
  return `<details class="ptt-art"><summary class="ptt-sum"><span class="ptt-meta">💬 ${esc(p.date)} · 推 ${p.push!=null?p.push:'—'}${p.boo?'／噓 '+p.boo:''}${p.arrow?'／→ '+p.arrow:''}</span> <a class="tl" href="${esc(p.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(p.title)} ↗</a>${p.hit&&p.hit.length?`<span class="amp-why" style="display:inline">✓ ${p.hit.map(esc).join('、')}</span>`:''} <span class="cx-toggle">▼ 看本篇 ${shown} 則推文</span></summary>${capNote}${pttSampleRows(p.samples)}</details>`;
}
function commentRowHtml(c){
  const ic=c.sig==='red'?'🔴':c.sig==='yellow'?'🟡':c.sig==='green'?'🟢':'⚪';
  return `<div class="cm-row"><div class="cm-meta">${ic} <b>${esc(c.author)}</b> · ${esc(c.plat)} · ${esc(c.time)}</div><div class="cm-text">${esc(c.text)}</div></div>`;
}
function dailyCommentsHtml(cp){
  const dc=(cp&&cp.daily_comments)||[];
  if(!dc.length) return `<div style="font-size:11.5px;color:var(--dim);margin-top:8px">紫色虛線（上圖）＝社群留言量走勢。本事件期間無對應留言。</div>`;
  return `<details class="cm-details" style="margin-top:8px"><summary>▼ 點開每日留言（對照上圖紫線走勢，看每天鄉民實際說什麼）</summary>
    <div style="font-size:11px;color:var(--dim);margin:4px 0">紫色虛線＝社群留言量走勢；下方按日展開＝當天實際留言（🔴負面／🟡中性偏負／🟢友善）。留言無原文連結（資料源未存 permalink）。</div>
    ${dc.map(d=>`<details class="cx-day"><summary>${esc(d.date.slice(5))}　${d.n} 則（🔴 ${d.red}）</summary><div class="cm-list">${d.items.map(commentRowHtml).join('')}</div></details>`).join('')}</details>`;
}
let _pttIid=0; const PTT_REG={};
const _pttSig=t=>t==='推'?'🟢 推':t==='噓'?'🔴 噓':'⚪ →';
function _pttPushRows(pushes){
  return `<div class="cm-list">${(pushes||[]).map(s=>`<div class="cm-row"><div class="cm-meta">${_pttSig(s.tag)} <b>${esc(s.uid)}</b> · ${esc(s.time)}</div><div class="cm-text">${esc(s.text)}</div></div>`).join('')}</div>`;
}
function _pttHourInner(iid,h){
  const hs=(PTT_REG[iid]||{})[h]||[];
  return `<div class="cn-h">🕐 ${esc(h)}時　${hs.length} 則推文</div>${hs.length?_pttPushRows(hs):'<div class="empty" style="font-size:11.5px">該時段無推文樣本（可能只有純標記/已刪推文）</div>'}`;
}
function showPttHour(iid,h){
  const box=document.getElementById('ppHourBox_'+iid); if(!box)return;
  document.querySelectorAll('.pp-bars[data-iid="'+iid+'"] .pp-bar').forEach(b=>b.classList.toggle('sel',b.getAttribute('data-h')===h));
  box.innerHTML=_pttHourInner(iid,h);
}
function pttHourlyBar(hourly,iid,defH){
  if(!hourly||!hourly.length) return '';
  const max=Math.max(...hourly.map(h=>h.n),1);
  return `<div class="pp-bars" data-iid="${iid}">${hourly.map(h=>`<div class="pp-bar${h.h===defH?' sel':''}" data-h="${esc(h.h)}" onclick="showPttHour(${iid},'${esc(h.h)}')" title="${esc(h.h)}時 推噓 ${h.n} 則 — 點看該時段推文"><div class="pp-fill" style="height:${Math.max(6,Math.round(h.n/max*100))}%"></div><div class="pp-lbl">${esc((h.h||'').slice(-2))}</div></div>`).join('')}</div><div class="pp-axis">逐小時推文量 — 點長條看該時段推文</div>`;
}
function renderPttPulse(pp,pttArts){
  if(!pp) return '';
  const iid=++_pttIid;
  // 從各 PTT 文的「全部推文」依「MM/DD HH」分桶（全列、不設上限）；fallback 用引擎的 hour_samples
  const buckets={};
  (pttArts||[]).forEach(a=>(a.samples||[]).forEach(s=>{
    const hk=(s.time||'').slice(0,8);
    if(hk.length===8&&hk.indexOf(':')<0){(buckets[hk]=buckets[hk]||[]).push(s);}
  }));
  PTT_REG[iid]=Object.keys(buckets).length?buckets:(pp.hour_samples||{});
  const hasHS=Object.keys(PTT_REG[iid]).length>0;
  const hrs=pp.hourly||[];
  const defH=pp.peak_hour||(hrs.length?hrs.reduce((a,b)=>b.n>a.n?b:a).h:'');
  const sams=(pp.samples||[]).map(s=>`<div class="cm-row"><div class="cm-meta">${_pttSig(s.tag)} <b>${esc(s.uid)}</b> · ${esc(s.time)}</div><div class="cm-text">${esc(s.text)}</div></div>`).join('');
  return `<div style="margin-top:12px;border-top:1px solid #2a335f;padding-top:10px">
    <div class="sec-title" style="font-size:13px">🔥 PTT 鄉民熱度 <span class="hint">${pp.n_articles} 篇 · 推噓比＝共識方向 · 逐小時＝燒起來速度</span></div>
    <div class="pp-stats"><span class="pp-up">推 ${pp.push}</span><span class="pp-down">噓 ${pp.boo}</span><span class="pp-arrow">→ ${pp.arrow}</span>${pp.ratio!=null?`<span class="pp-ratio">推噓比 ${pp.ratio}:1${pp.ratio>=3?'（一面倒）':(pp.ratio<1?'（負評為主）':'')}</span>`:''}${pp.peak_hour?`<span class="pp-peak">爆文高峰 ${esc(pp.peak_hour)}時</span>`:''}</div>
    ${pttHourlyBar(pp.hourly,iid,defH)}
    ${hasHS?`<div id="ppHourBox_${iid}" class="chart-news" style="margin-top:6px">${_pttHourInner(iid,defH)}</div>`:''}
    ${sams?`<details class="cm-details"><summary>▼ 代表推文（最熱文 ${(pp.samples||[]).length} 則）${pp.top_title?'：'+esc(pp.top_title):''}</summary><div class="pp-note">代表推文＝本事件<b>推文數最高的那篇</b>，依時間順序取「推 6＋噓 4＋→ 3」則，刻意納入正反兩面（🟢推＝同意/聲援、🔴噓＝反對），不是只挑罵得最兇的。</div><div class="cm-list">${sams}</div></details>`:''}
  </div>`;
}
const RESP_WHY={
  '首長哀悼/慰問表態':'重大傷亡時首長第一時間表態＝展現「重視、有人性」，是阻斷「冷血」框架最快、成本最低、效益最高的一步。',
  '親赴現場/視察坐鎮':'首長親赴現場＝最強的正面新聞畫面，把報導框架從「慘劇/失職」直接導向「市府全力處理」。對危機事件，「人到場」本身就是訊息（向社會證明有在重視），且能即時下令、安撫家屬與基層。缺這一步＝把最有力的畫面讓給對手去定義事件。判斷依據：本案被歸為「攻防型」+ 高紅燈，這類事件「首長現身」的輿論收益最大，故列為首要補強。',
  '究責/處分/重罰':'快速強硬的究責＝把市府放在「執法者/受害方代言人」位置（而非被檢討方），導引民怒方向。',
  '對外說明/澄清':'用事實時間軸主動說明＝搶回定義權，後續報導引用官方版本比例上升，稀釋單一負面框架。',
  '善後/協助措施':'撫卹/安置/心理支持＝展現「有溫度」，把後續報導餵成正面素材。',
  '制度檢討/改革承諾':'制度改革＝把敘事從「失職」轉成「改革者」，把責任拉高到中央地方共擔；也是長期選情的關鍵兌現項。'
};
function leverageHtml(t){
  if(!t||t.kind!=='leverage') return '';
  const la=t.leverage_actions||[],am=t.amplify_material||[],gr=t.guardrails||[];
  if(!la.length&&!am.length&&!gr.length) return '';
  return `<div class="tailored leverage"><div class="tl-cap">🎯 針對「本議題」的聲量經營（非危機，順勢操作）</div>
    ${la.length?`<div class="tl-h">📈 具體怎麼順勢經營（把高聲量導向施政成績）</div><ul class="tl-ul">${la.map(x=>`<li>${linkify(x)}</li>`).join('')}</ul>`:''}
    ${am.length?`<div class="tl-h">🎤 該主打的素材／訊息點</div><ul class="tl-ul amp">${am.map(x=>`<li>${linkify(x)}</li>`).join('')}</ul>`:''}
    ${gr.length?`<div class="tl-h amber">⚠️ 翻車紅線（過度操作／失言的界線）</div><ul class="tl-ul guard">${gr.map(x=>`<li>${linkify(x)}</li>`).join('')}</ul>`:''}</div>`;
}
function tailoredHtml(t){
  if(!t) return '';
  if(t.kind==='leverage') return leverageHtml(t);
  const trig=t.ignition_trigger?`<div class="tl-trig">🚨 <b>引爆條件</b>（出現以下任一＝從觀察切入正式危機處理 SOP）<div class="tl-trig-b">${esc(t.ignition_trigger)}</div></div>`:'';
  const acts=(t.tailored_actions&&t.tailored_actions.length)?`<div class="tl-h">⚡ 針對本案的黃金 4 小時首要動作</div><ul class="tl-ul">${t.tailored_actions.map(x=>`<li>${linkify(x)}</li>`).join('')}</ul>`:'';
  const prev=(t.tailored_prevent&&t.tailored_prevent.length)?`<div class="tl-h">🛡 針對本案的預防／監測重點</div><ul class="tl-ul prev">${t.tailored_prevent.map(x=>`<li>${linkify(x)}</li>`).join('')}</ul>`:'';
  if(!trig&&!acts&&!prev) return '';
  return `<div class="tailored"><div class="tl-cap">🎯 針對「本事件」客製研判（非通用模板）</div>${trig}${acts}${prev}</div>`;
}
function playbookHtml(e){
  const pb=e.playbook||{};
  const cols=[['⚡ 黃金 4 小時（引爆當天）','immediate'],['🕐 24 小時內','short'],['📅 1-3 天','mid'],['🗡 反擊線（被動才用）','counter'],['🛡 預防與預警','prevention']];
  const play=cols.map(([t,k])=>pb[k]&&pb[k].length?`<div class="play-col"><h4>${t}</h4>${renderCards(pb[k])}</div>`:'').join('');
  const notes=(pb.notes||[]).map(n=>`<div class="note-box"><b>📌 本案實證</b>　${esc(n)}</div>`).join('');
  return `<div class="play-grid">${play}</div>${notes}`;
}
function newsTable(items){
  return `<table><tr><th>時間</th><th>媒體</th><th>燈</th><th>標題</th></tr>${items.map(it=>`<tr><td style="white-space:nowrap">${esc(it.time)}</td><td>${esc(it.outlet)}</td><td class="sev-${esc(it.sev)}">${esc((it.sev||'').slice(0,1))||'—'}</td><td>${it.link?`<a class="tl" href="${esc(it.link)}" target="_blank" rel="noopener">${esc(it.title)} ↗</a>`:esc(it.title)}</td></tr>`).join('')}</table>`;
}
function chainExpand(e,n){
  const ph=e.phases||{},ig=e.ignition_detail||{},fp=e.fingerprint||{},amp=e.amplifiers||{};
  if(n===1){
    const dn=e.daily_news||[]; if(!dn.length) return '';
    return `<div class="cx"><div class="cx-h">📅 逐日報導 — 點各天展開當天新聞（附連結）</div>${dn.map(d=>`<details class="cx-day"><summary>${esc(d.date.slice(5))}　${d.n} 篇（🔴 ${d.red}）</summary>${newsTable(d.items)}</details>`).join('')}</div>`;
  }
  if(n===2){
    const ignN=ig.n||0, base=Math.max(1,Math.round(ignN/(ph.burst||1)));
    return `<div class="cx"><div class="cx-h">📖 ${ph.burst}× 怎麼算、代表什麼</div><ul class="cx-ul">
      <li><b>數據來源</b>：引爆日（${(ph.ignition||'').slice(5)}）當天共 <b>${ignN} 篇</b>獨立報導（＝①逐日報導裡該天的篇數，現已可全部展開核對），相對引爆前 3 天的低基期（平均約 <b>${base} 篇/日</b>）暴增 → <b>${ignN} ÷ ${base} ≈ ${ph.burst}×</b>。註：用「獨立報導」去重後計算，含轉載的體感聲量更高。</li>

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; OpenStreetMap'}).addTo(incidentMap);
  }
  if(incidentMap._layer) incidentMap.removeLayer(incidentMap._layer);
  const layer=L.featureGroup(); _mapReg={}; _mapId=0;
  const placed={}, unplaced=[], COL={red:'#ff5d6c',yellow:'#ffc24b',green:'#3ddc97'};
  function plot(item,isWatch){
    const g=geocodeEvent(item);
    if(!g||g.other||g.lat==null){ let uid=null; if(!isWatch){uid=_mapId++; _mapReg[uid]=item.name;} unplaced.push({name:item.name,reason:g&&g.other?('他縣市：'+g.other):'非地點型／無法定位',uid}); return; }
    let lat=g.lat,lng=g.lng; const key=lat.toFixed(2)+','+lng.toFixed(2); const c=placed[key]=(placed[key]||0)+1;
    if(c>1){const ang=c*2.4,r=0.008*Math.ceil(c/6); lat+=r*Math.cos(ang); lng+=r*Math.sin(ang);}
    const lvl=evLevel(item),col=COL[lvl],nt=item.n_total||item.n||1;
    const rad=Math.max(7,Math.min(20,6+Math.sqrt(nt)*1.4))*(isWatch?0.72:1);
    const id=_mapId++; _mapReg[id]=item.name;
    const m=L.circleMarker([lat,lng],{radius:rad,color:col,weight:isWatch?2:1.5,fillColor:col,fillOpacity:isWatch?0.12:0.62,dashArray:isWatch?'3 3':null});
    const ig=(item.phases&&item.phases.ignition)||'';
    const meta=isWatch?`${esc(item.topic||'')}｜預警雷達｜首見 ${(item.first_seen||'').slice(5)}｜${item.n} 則（紅 ${item.n_red}）`
                      :`${esc(item.topic||'')}｜引爆 ${(ig||'').slice(5)}｜${nt} 篇（紅 ${item.n_red}）`;
    const btn=isWatch?'':`<a class="mp-go" onclick="selectEventByMapId(${id})">查看完整解構 →</a>`;
    m.bindPopup(`<div class="map-popup"><b>${esc(item.name)}</b>${isWatch?' <span style="color:#b06a00">⚠預警</span>':''}<div class="mp-meta">📍 ${esc(g.place)}${g.generic?'（區未定）':''}</div><div class="mp-meta">${meta}</div>${btn}</div>`);
    layer.addLayer(m);
  }
  (d.events||[]).forEach(e=>plot(e,false));
  (d.watchlist||[]).forEach(w=>plot(w,true));
  layer.addTo(incidentMap); incidentMap._layer=layer;
  const b=layer.getBounds(); if(b.isValid()) incidentMap.fitBounds(b.pad(0.2));
  setTimeout(()=>{try{incidentMap.invalidateSize();}catch(e){}},120);
  const ue=document.getElementById('mapUnplaced');
  if(ue) ue.innerHTML = unplaced.length
    ? '未標於地圖（非台中地點或無法定位，點可看解構）：'+unplaced.map(u=>`<span class="mu-chip"${u.uid!=null?` onclick="selectEventByMapId(${u.uid})"`:''}>${esc(u.name)}（${esc(u.reason)}）</span>`).join('')
    : '';
}

function sparkline(series,w,h){
  const max=Math.max(...series.map(s=>s.n),1);
  const bw=Math.max(2,Math.floor(w/series.length)-1);
  let x=0,bars='';
  for(const s of series){
    const bh=Math.max(1,Math.round(s.n/max*(h-2)));
    const frac=s.n?{r:s.red/s.n,y:s.yellow/s.n}:{r:0,y:0};
    const col=frac.r>=.4?'var(--red)':(frac.r+frac.y>=.5?'var(--yel)':'#44508a');
    bars+=`<rect x="${x}" y="${h-bh}" width="${bw}" height="${bh}" fill="${col}" rx="1"/>`;
    x+=bw+1;
  }
  return `<svg class="spark" width="${x}" height="${h}" viewBox="0 0 ${x} ${h}">${bars}</svg>`;
}

// 固定 7 日爆量視窗 ⇄ 全期 切換
let LIFE_FULL=false;
function setLifeView(full){LIFE_FULL=!!full;renderDetail(DATA.events[CUR]);}
// JSON 未重跑（無 burst_window）時的後備：由 series + 引爆日補出 7 格
function deriveWindow(e){
  const ign=e.phases&&e.phases.ignition; if(!ign) return e.series||[];
  const map={}; (e.series||[]).forEach(s=>map[s.date]=s);
  const base=new Date(ign+'T00:00:00'), out=[];
  for(let k=-1;k<=5;k++){
    const ds=new Date(base.getTime()+k*86400000).toISOString().slice(0,10), s=map[ds];
    out.push(s?Object.assign({},s,{rel:k,is_ignition:k===0,slot_kind:'data'})
              :{date:ds,rel:k,is_ignition:k===0,slot_kind:'empty',n:0,raw:0,red:0,yellow:0,green:0,uniq:0,c_n:0,c_red:0,yt_n:0,ptt_n:0});
  }
  return out;
}
function lifeChart(e){
  const FULL=LIFE_FULL;
  const S = FULL ? (e.series||[]) : ((e.burst_window&&e.burst_window.length)?e.burst_window:deriveWindow(e));
  if(!S.length) return '';
  const W=Math.max(560,Math.min(900,S.length*(FULL?26:80))),H=204,PB=48,PL=30,PT=18;
  const max=Math.max(...S.map(s=>s.n),1);
  const cmax=Math.max(...S.map(s=>s.c_n),1);
  const bw=Math.max(5,Math.floor((W-PL-8)/S.length)-3);
  const defs=`<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#161c38"/><line x1="0" y1="0" x2="0" y2="6" stroke="#39427a" stroke-width="1.4"/></pattern></defs>`;
  let g='',x=PL; const pos={};
  for(const s of S){
    const sk=s.slot_kind||'data', cx=x+bw/2; pos[s.date]=cx;
    if(sk==='out_of_range'||sk==='future'){
      g+=`<rect x="${x}" y="${PT}" width="${bw}" height="${H-PB-PT}" fill="url(#hatch)" opacity=".55"><title>${s.date} ${sk==='future'?'尚未發生':'落在 45 日採集窗外（無法分辨安靜或未採集）'}</title></rect>`;
      g+=`<text x="${cx}" y="${(PT+H-PB)/2}" font-size="8.5" fill="var(--dim)" text-anchor="middle">${sk==='future'?'尚未發生':'窗外·無採集'}</text>`;
    } else {
      const total=s.n, bh=Math.round(total/max*(H-PB-PT)); let y=H-PB;
      for(const [k,col] of [['green','var(--grn)'],['yellow','var(--yel)'],['red','var(--red)']]){
        const hh=total?Math.round(s[k]/total*bh):0;
        if(hh>0){y-=hh;g+=`<rect x="${x}" y="${y}" width="${bw}" height="${hh}" fill="${col}" opacity=".9" rx="1"><title>${s.date} ${k==='red'?'紅':k==='yellow'?'黃':'綠'} ${s[k]} 篇</title></rect>`;}
      }
      if(bh===0)g+=`<rect x="${x}" y="${H-PB-1}" width="${bw}" height="1" fill="#2a335f"/>`;
      g+=`<rect class="day-hit" data-date="${s.date}" x="${x}" y="${PT}" width="${bw}" height="${H-PB-PT}" onclick="showDayNews(CUR,'${s.date}')"><title>${s.date.slice(5)}　${s.n} 篇（紅 ${s.red}）— 點看當日新聞</title></rect>`;
    }
    // x 軸：日期 + （視窗模式）相對日 + 空欄「無報導」
    const showDate = FULL ? (S.length<=20||S.indexOf(s)%Math.ceil(S.length/14)===0) : true;
    if(showDate) g+=`<text x="${cx}" y="${H-PB+12}" font-size="9" fill="var(--dim)" text-anchor="middle">${s.date.slice(5)}</text>`;
    if(!FULL && s.rel!=null){
      const rlab = s.rel===0?'':(s.rel===-1?'前一天':('+'+s.rel+'日'));
      if(rlab) g+=`<text x="${cx}" y="${H-PB+23}" font-size="8.5" fill="#6b76aa" text-anchor="middle">${rlab}</text>`;
      if(sk==='empty') g+=`<text x="${cx}" y="${H-PB+34}" font-size="8" fill="#55608f" text-anchor="middle">無報導</text>`;
    }
    x+=bw+3;
  }
  // 留言折線（只連有資料的欄）
  let pts='';
  for(const s of S){ if((s.slot_kind||'data')==='data') pts+=`${pos[s.date]},${H-PB-(s.c_n/cmax*(H-PB-PT))*0.92} `; }
  if(S.some(s=>s.c_n>0))g+=`<polyline points="${pts.trim()}" fill="none" stroke="#c084fc" stroke-width="1.6" stroke-dasharray="3 2" opacity=".9" pointer-events="none"/>`;
  // 階段標記（pointer-events:none 讓底下整天的可點區塊收得到點擊）
  const mark=(date,label,col)=>{const px=pos[date];if(px==null)return'';
    return `<line x1="${px}" y1="${PT-4}" x2="${px}" y2="${H-PB}" stroke="${col}" stroke-width="1" stroke-dasharray="2 2" pointer-events="none"/>
            <text x="${px}" y="${PT-3}" font-size="9.5" fill="${col}" text-anchor="middle" font-weight="700" pointer-events="none">${label}</text>`;};
  g+=mark(e.phases.ignition,'🔥引爆','var(--red)');
  if(e.phases.peak!==e.phases.ignition)g+=mark(e.phases.peak,'高峰','var(--yel)');
  if(e.phases.reversal)g+=mark(e.phases.reversal.date,'⏪逆轉','var(--grn)');
  // 視窗模式：高峰/逆轉落在 7 日窗外 → 提示可切全期
  if(!FULL){
    const offs=[];
    if(e.phases.peak!==e.phases.ignition && pos[e.phases.peak]==null) offs.push('高峰 '+e.phases.peak.slice(5));
    if(e.phases.reversal && pos[e.phases.reversal.date]==null) offs.push('逆轉 '+e.phases.reversal.date.slice(5));
    if(offs.length) g+=`<text x="${PL}" y="${PT-5}" font-size="9" fill="var(--yel)">⚠ ${offs.join('、')} 落在 7 日窗外（切「看完整週期」可見）</text>`;
  }
  const legend = FULL ? '█紅 █黃 █綠＝每日報導（堆疊）　- - 紫線＝社群留言量　｜全期'
                      : '█紅 █黃 █綠＝每日報導　- - 紫線＝留言量　｜固定 7 日：引爆前1天＋引爆＋後5天';
  g+=`<text x="${PL}" y="${H-2}" font-size="9.5" fill="var(--dim)">${legend}</text>`;
  return `<svg width="100%" viewBox="0 0 ${W} ${H}" style="max-width:${W}px">${defs}${g}</svg>`;
}

// ── 可點擊圖表：點某天/某時段 → 顯示該時段新聞（最早一篇標記）──────────────
function _emin(t){const m=/(\d{1,2}):(\d{2})/.exec(t||'');return m?(+m[1]*60+ +m[2]):99999;}
function _newsTable(items){
  // 依時間遞增排序，🔥 標記最早一篇（僅當該篇真有可解析時間；無時間戳則不標）
  const arr=items.slice().sort((a,b)=>_emin(a.time)-_emin(b.time));
  const firstIdx=(arr.length && _emin(arr[0].time)<99999)?0:-1;
  const rows=arr.map((it,i)=>`<tr class="${i===firstIdx?'cn-first':''}">
    <td style="white-space:nowrap">${i===firstIdx?'<span class="cn-badge">🔥 最早</span> ':''}${esc(it.time)}</td>
    <td>${esc(it.outlet)}</td><td class="sev-${esc(it.sev)}">${esc((it.sev||'').slice(0,1))||'—'}</td>
    <td>${it.link?`<a class="tl" href="${esc(it.link)}" target="_blank" rel="noopener">${esc(it.title)} ↗</a>`:esc(it.title)}</td></tr>`).join('');
  return `<div class="cn-scroll"><table><tr><th>時間</th><th>媒體</th><th>燈</th><th>標題</th></tr>${rows}</table></div>`;
}
function showDayNews(ei,date){
  const box=document.getElementById('lifeNews'); if(!box)return;
  const e=DATA.events[ei]; const dn=(e.daily_news||[]).find(x=>x.date===date);
  document.querySelectorAll('rect.day-hit').forEach(r=>r.classList.toggle('sel',r.getAttribute('data-date')===date));
  if(!dn||!dn.items||!dn.items.length){box.innerHTML=`<div class="chart-news"><div class="cn-h">📅 ${date.slice(5)}　當日無新聞報導</div></div>`;return;}
  box.innerHTML=`<div class="chart-news"><div class="cn-h">📅 ${date.slice(5)} 當日 ${dn.n} 篇報導（🔴 ${dn.red}）<span class="cn-hint">依時間排序，🔥＝當天最早出現的一篇</span></div>${_newsTable(dn.items)}</div>`;
}
function showHourNews(ei,hour){
  const box=document.getElementById('ignHourNews'); if(!box)return;
  const e=DATA.events[ei]; const dn=(e.daily_news||[]).find(x=>x.date===e.phases.ignition);
  document.querySelectorAll('.hour-hist .hh-col').forEach((c,h)=>c.classList.toggle('sel',h===hour));
  const items=[]; if(dn&&dn.items){for(const it of dn.items){const mm=/(\d{1,2}):(\d{2})/.exec(it.time||'');if(mm){const hr=+mm[1];if(hr===hour&&hr>=0&&hr<24)items.push(it);}}}
  const hh2=(hour<10?'0'+hour:''+hour), hl=hh2+':00–'+hh2+':59';
  if(!items.length){box.innerHTML=`<div class="chart-news"><div class="cn-h">🕐 引爆日 ${hl}　該時段無發稿</div></div>`;return;}
  box.innerHTML=`<div class="chart-news"><div class="cn-h">🕐 引爆日 ${hl}　${items.length} 篇 <span class="cn-hint">🔥＝該時段最早一篇</span></div>${_newsTable(items)}</div>`;
}

      <div class="sec-title">🔥 引爆解構 <span class="hint">誰點的火、火怎麼燒起來</span></div>
      <table><tr><th>時間</th><th>媒體</th><th>燈</th><th>第一批報導（按時間）</th></tr>${fm}</table>
      <div class="kv"><span>引爆日同稿率（${ig.n} 篇 / ${ig.uniq_titles} 個獨立標題）</span><b>${Math.round(ig.copy_rate*100)}%</b></div>
      <div class="kv"><span>引爆日 3 小時集中度</span><b>${ig.dense3?Math.round(ig.dense3*100)+'%':'樣本不足'}</b></div>
      <div class="kv"><span>夜間（22-06時）發稿比</span><b>${Math.round(ig.night*100)}%</b></div>
      ${hh}
    </div>
    <div class="sub-panel">
      <div class="sec-title">🧬 操作指紋 <span class="hint">指標推斷，非定論</span></div>
      <div class="gauge"><span class="num" style="color:${fp.score>=60?'var(--red)':fp.score>=38?'var(--yel)':'var(--grn)'}">${fp.score}</span>
        <div><div class="lbl">${esc(fp.label)}</div><div class="desc">${esc(fp.desc)}</div></div></div>
      ${indic}
    </div>
    <div class="sub-panel">
      <div class="sec-title">📡 跨平台脈動 <span class="hint">誰先燒：社群 vs 媒體</span></div>
      <div style="font-size:13px;margin-bottom:8px">${esc(cp.verdict)}</div>
      ${cp.narrative?`<div class="cm-narr" style="margin-bottom:8px">🔥 ${esc(cp.narrative)}</div>`:''}
      <div class="kv"><span>事件相關留言總數</span><b>${cp.c_total} 則</b></div>
      ${cp.c_red_peak!=null?`<div class="kv"><span>高峰日留言紅燈占比</span><b class="sev-紅燈">${Math.round(cp.c_red_peak*100)}%</b></div>`:''}
      ${dailyCommentsHtml(cp)}
    </div>
    <div class="sub-panel">
      <div class="sec-title">📰 媒體光譜與集中度 <span class="hint">誰在報、誰報最多</span></div>
      ${leanBar}${outlets}
    </div>
    ${ampPanel}
  </div>
  ${commentsPanel}
  <div style="margin-top:14px"><div class="sec-title">📎 引爆日代表報導</div>
    <table><tr><th>時間</th><th>媒體</th><th>燈</th><th>標題</th></tr>${samples}</table></div>`;
  // 預設先選取，讓兩張圖一載入就有內容（生命週期圖→引爆日；逐時圖→篇數最多的時段）
  showDayNews(CUR, ph.ignition);
  if(ig.timed_n>=3 && ignDN && ignDN.items){
    const bk=Array.from({length:24},()=>0);
    for(const it of ignDN.items){const mm=/(\d{1,2}):(\d{2})/.exec(it.time||'');if(mm){const hr=+mm[1];if(hr>=0&&hr<24)bk[hr]++;}}
    let hsel=0,mx=-1; bk.forEach((v,h)=>{if(v>mx){mx=v;hsel=h;}});
    showHourNews(CUR, hsel);
  }
}
</script>
</body>
</html>
