<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>事件解構 · 脈絡透明化｜台中輿情鑑識</title>
<style>
:root{--bg:#0b1020;--panel:#121935;--panel2:#0c1228;--bd:#2a335f;--tx:#e8ecff;--mut:#b9c3f2;--dim:#6b7494;
--acc:#5a79ff;--red:#ff5d6c;--yel:#ffc24b;--grn:#3ddc97;--org:#ff9f43}
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang TC','Microsoft JhengHei',sans-serif;
background:var(--bg);color:var(--tx);margin:0;padding:16px;line-height:1.5}
.wrap{max-width:1280px;margin:0 auto}
h1{font-size:21px;margin:0 0 2px;display:flex;align-items:center;gap:10px}
h1 .sub{font-size:12px;color:var(--mut);font-weight:400}
.meta{color:var(--dim);font-size:12px;margin-bottom:14px}
.panel{background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:14px;min-width:0}
.sec-title{font-size:14px;font-weight:700;margin:0 0 10px;display:flex;align-items:center;gap:6px;color:var(--tx)}
.sec-title .hint{font-weight:400;font-size:11px;color:var(--dim)}
/* 預警雷達 */
.watch-strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.watch-card{flex:0 0 250px;background:var(--panel2);border:1px solid #3d2a2a;border-left:3px solid var(--org);
border-radius:10px;padding:10px 12px;font-size:12px;transition:border-color .12s}
.watch-card:hover{border-color:var(--org)}
.watch-card.wc-open{border-color:var(--org);box-shadow:0 0 0 1px var(--org);background:#1a1410}
.watch-card b{font-size:13px}
.watch-card .wc-meta{color:var(--mut);margin:4px 0}
.watch-card .wc-note{color:var(--org);font-size:11px;margin-top:6px}
.watch-card a{color:var(--mut);text-decoration:none;font-size:11px}
.watch-card a:hover{color:var(--acc)}
/* 版面 */
.layout{display:grid;grid-template-columns:330px 1fr;gap:14px;margin-top:14px}
@media(max-width:900px){.layout{grid-template-columns:1fr}}
/* 事件清單 */
.ev-card{background:var(--panel2);border:1px solid var(--bd);border-radius:10px;padding:11px 12px;margin-bottom:9px;
cursor:pointer;transition:border-color .12s,transform .08s}
.ev-card:hover{border-color:var(--acc);transform:translateY(-1px)}
.ev-card.active{border-color:var(--acc);background:#16203f;box-shadow:0 0 0 1px var(--acc)}
.ev-card .name{font-weight:700;font-size:14px;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.ev-card .name .score{font-size:11px;color:var(--dim);white-space:nowrap}
.ev-row{display:flex;gap:6px;align-items:center;margin-top:5px;flex-wrap:wrap}
.chip{font-size:10.5px;padding:1px 8px;border-radius:99px;border:1px solid var(--bd);color:var(--mut);white-space:nowrap}
.chip.topic{border-color:#3a4a8a;color:#9db1ff}
.chip.fp-高度協同跡象{border-color:var(--red);color:var(--red)}
.chip.fp-媒體議程推動型{border-color:var(--yel);color:var(--yel)}
.chip.fp-自然發酵型{border-color:var(--grn);color:var(--grn)}
.spark{margin-top:7px}
.ev-card .mini{color:var(--dim);font-size:11px;margin-top:4px}
/* 詳情 */
.det-head{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;margin-bottom:4px}
.det-head h2{font-size:19px;margin:0}
.statline{display:flex;gap:14px;flex-wrap:wrap;color:var(--mut);font-size:12.5px;margin:8px 0 2px}
.statline b{color:var(--tx)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
@media(max-width:1000px){.grid2{grid-template-columns:1fr}}
.sub-panel{background:var(--panel2);border:1px solid var(--bd);border-radius:10px;padding:12px}
table{width:100%;border-collapse:collapse;font-size:12px}
td,th{padding:4px 6px;text-align:left;vertical-align:top;border-bottom:1px solid #1a2241}
th{color:var(--dim);font-weight:600;font-size:11px}
a.tl{color:var(--tx);text-decoration:none;border-bottom:1px dotted #44508a}
a.tl:hover{color:var(--acc);border-color:var(--acc)}
.sev-紅燈{color:var(--red)}.sev-黃燈{color:var(--yel)}.sev-綠燈{color:var(--grn)}
.lean-泛藍{color:#7da2ff}.lean-泛綠{color:#5fd9a2}.lean-中性{color:#cfd6f5}.lean-聚合{color:#9aa3c7}.lean-通訊社,.lean-公共{color:#b9c3f2}
.kv{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px dashed #1a2241}
.kv span:first-child{color:var(--mut)}
.indic{margin:7px 0;padding:8px 10px;background:#0e1530;border:1px solid #1f2950;border-radius:8px}
.indic .ir{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600}
.indic .ev{color:var(--mut);font-size:11.5px;margin-top:2px}
.bar-bg{height:5px;background:#1a2241;border-radius:99px;margin-top:5px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--grn),var(--yel) 55%,var(--red))}
.gauge{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.gauge .num{font-size:30px;font-weight:800}
.gauge .lbl{font-size:13px;font-weight:700}
.gauge .desc{font-size:11.5px;color:var(--mut)}
.lean-bar{display:flex;height:16px;border-radius:6px;overflow:hidden;margin:8px 0;border:1px solid var(--bd)}
.lean-bar div{height:100%}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--mut);margin-top:4px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
/* 逆轉 / 手冊 */
.rev-box{border-left:3px solid var(--grn);background:#0e1d18;border-radius:8px;padding:10px 12px;margin-top:12px;font-size:13px}
.rev-box.none{border-color:var(--dim);background:#10162e;color:var(--mut)}
.play-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-top:10px}
.play-col{background:var(--panel2);border:1px solid var(--bd);border-radius:10px;padding:11px}
.play-col h4{margin:0 0 7px;font-size:12.5px;color:var(--acc)}
.play-col ul{margin:0;padding-left:16px;font-size:12px;color:var(--tx)}
.play-col li{margin-bottom:6px}
.note-box{background:#1a1430;border:1px solid #3a2a6a;border-radius:8px;padding:10px 12px;margin-top:10px;font-size:12.5px}
.note-box b{color:#c0a8ff}
.play-grid{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.op-card{background:#0e1530;border:1px solid #28315a;border-radius:8px;padding:9px 10px;margin-bottom:8px}
.op-card .oc-a{font-weight:700;font-size:12.5px;color:#cdd6ff;margin-bottom:5px;line-height:1.4}
.op-row{display:flex;gap:6px;font-size:11.5px;line-height:1.55;margin-top:3px}
.op-row .k{flex:0 0 56px;color:var(--dim);font-weight:600}
.op-row .v{flex:1;min-width:0}
.op-row.how .v{color:#dfe6ff}.op-row.cost .v{color:#ffcf8f}.op-row.impact .v{color:#9fe6c0}.op-row.risk .v{color:#ff9ba6}
.chain{margin:6px 0 2px}
.chain-link{display:flex;padding:8px 2px;border-bottom:1px dashed #1c2547}
.chain-link:last-child{border-bottom:none}
.chain-body{flex:1;min-width:0}
.chain-title{font-size:11.5px;color:var(--acc);font-weight:700}
.chain-find{font-size:13px;color:var(--tx);font-weight:600;margin:2px 0}
.chain-ev{font-size:11.5px;color:var(--mut);line-height:1.5}
.chain-link3{padding:8px 2px;border-bottom:1px dashed #1c2547}
.chain-link3:last-child{border-bottom:none}
.chain-link3>summary{cursor:pointer;list-style:none;user-select:none}
.chain-link3>summary::-webkit-details-marker{display:none}
.chain-link3>summary:hover .cx-toggle{color:var(--acc)}
.cx-toggle{font-size:10.5px;color:var(--dim);font-weight:400}
.chain-link3[open]>summary .cx-toggle::after{content:' (收合)'}
.cx-wrap{margin:8px 0 4px;padding:10px 12px;background:#0c1228;border:1px solid #232c52;border-radius:8px}
.cx-h{font-size:12px;font-weight:700;color:var(--acc);margin-bottom:7px}
.cx-ul{margin:0;padding-left:16px;font-size:12px;line-height:1.65;color:var(--tx)}
.cx-ul li{margin-bottom:6px}
.cx-day{margin:4px 0;border-bottom:1px dashed #18203f}
.cx-day>summary{cursor:pointer;font-size:12px;color:var(--mut);padding:3px 0;font-weight:600}
.cx-day>summary:hover{color:var(--acc)}
.cx-rec{border-left:3px solid var(--acc);background:#0e1530;border-radius:8px;padding:9px 11px;margin-top:2px}
.cx-mode{font-size:14px;font-weight:800;margin-bottom:4px}
.cx-row{font-size:12px;line-height:1.55;margin-top:3px;color:var(--tx)}
.cx-row b{color:var(--mut);font-weight:600}
.cx-opt{margin-top:8px;font-size:12px;line-height:1.6;background:#1a1430;border:1px solid #3a2a6a;border-radius:8px;padding:8px 10px;color:#dcd2ff}
.amp-why{font-size:10.5px;color:#7fd0a0;margin-top:2px}
.amp-snip{font-size:10.5px;color:var(--mut);margin-top:1px}
.cm-narr{background:#1d1530;border-left:3px solid var(--org);border-radius:6px;padding:8px 10px;font-size:12.5px;color:#ffd6a3;line-height:1.5}
.cm-earliest{background:#0e1530;border:1px solid #2a335f;border-radius:8px;padding:8px 10px;margin-top:8px;font-size:12px}
.cm-earliest .tag{background:var(--red);color:#fff;font-size:10px;padding:1px 7px;border-radius:99px;font-weight:700;margin-right:4px}
.cm-details{margin-top:8px}
.cm-details summary{cursor:pointer;color:var(--acc);font-size:12.5px;font-weight:600;padding:4px 0;user-select:none}
.cm-list{margin-top:6px;max-height:420px;overflow-y:auto;padding-right:4px}
.cm-row{padding:7px 2px;border-bottom:1px dashed #1c2547}
.cm-row:last-child{border-bottom:none}
.cm-meta{font-size:11px;color:var(--mut)}
.cm-text{font-size:12.5px;color:var(--tx);margin-top:2px;line-height:1.45;word-break:break-word}
.pp-stats{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;margin:6px 0}
.pp-up{color:var(--grn);font-weight:700}.pp-down{color:var(--red);font-weight:700}.pp-arrow{color:var(--mut)}
.pp-ratio{color:#ffd6a3;font-weight:700}.pp-peak{color:var(--acc)}
.pp-bars{display:flex;align-items:flex-end;gap:2px;height:54px;margin-top:6px}
.pp-bar{flex:1;min-width:6px;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.pp-fill{background:linear-gradient(180deg,var(--red),var(--org));border-radius:2px 2px 0 0;min-height:3px}
.pp-lbl{font-size:8px;color:var(--dim);text-align:center;margin-top:1px}
.pp-axis{font-size:10.5px;color:var(--dim);margin-top:2px}
.phase-tl{display:flex;gap:0;margin:10px 0 4px;font-size:11px;flex-wrap:wrap}
.phase-step{flex:1;min-width:110px;padding:7px 9px;background:var(--panel2);border:1px solid var(--bd);position:relative}
.phase-step:first-child{border-radius:8px 0 0 8px}.phase-step:last-child{border-radius:0 8px 8px 0}
.phase-step b{display:block;font-size:12px;margin-bottom:2px}
.phase-step.p-ign b{color:var(--red)}.phase-step.p-peak b{color:var(--yel)}.phase-step.p-rev b{color:var(--grn)}.phase-step.p-lat b{color:var(--mut)}
.caveats{margin-top:18px;color:var(--dim);font-size:11px;line-height:1.7}
.hour-hist{display:flex;align-items:flex-end;gap:1px;height:42px;margin-top:6px}
.hour-hist div{flex:1;background:var(--acc);opacity:.85;border-radius:2px 2px 0 0;min-height:1px}
.hour-lbl{display:flex;justify-content:space-between;font-size:9.5px;color:var(--dim)}
.empty{color:var(--dim);font-size:12px;padding:6px 0}
svg text{font-family:inherit}
</style>
</head>
<body>
<div class="wrap">
  <h1>🔬 事件解構 · 脈絡透明化 <span class="sub">台中輿情事件鑑識（盧秀燕基底）</span></h1>
  <div class="meta" id="meta">載入中…</div>

  <div class="panel" id="watchPanel" style="border-left:3px solid var(--org)">
    <div class="sec-title">⚠️ 預警雷達 <span class="hint">正處「潛伏期」的微弱訊號 — 今天的 2-3 則，可能是明天的引爆點。點卡片展開全部報導與應對</span></div>
    <div class="watch-strip" id="watchStrip"></div>
    <div id="watchDetail"></div>
  </div>

  <div class="layout">
    <div>
      <div class="sec-title" style="margin:2px 0 8px">📂 事件檔案 <span class="hint">按 聲量×嚴重度×引爆強度 排序</span></div>
      <div id="evList"></div>
    </div>
    <div id="detail" class="panel"></div>
  </div>

  <div class="caveats" id="caveats"></div>
</div>

<script>
let DATA=null, CUR=0;
const $=id=>document.getElementById(id);
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LEAN_COLORS={'泛藍':'#5b8def','泛綠':'#3ddc97','中性':'#aab4d8','聚合':'#5f6a8f','通訊社':'#8fa0d8','公共':'#8fa0d8','地方':'#7d88ad','其他':'#4a5575'};
function renderCards(arr){
  if(!arr||!arr.length) return '<div class="empty" style="font-size:11.5px">—</div>';
  return arr.map(c=>{
    if(typeof c==='string') return `<div class="op-card"><div class="oc-a">▸ ${esc(c)}</div></div>`;
    return `<div class="op-card"><div class="oc-a">▸ ${esc(c.a)}</div>
      ${c.how?`<div class="op-row how"><span class="k">怎麼做</span><span class="v">${esc(c.how)}</span></div>`:''}
      ${c.cost?`<div class="op-row cost"><span class="k">成本</span><span class="v">${esc(c.cost)}</span></div>`:''}
      ${c.impact?`<div class="op-row impact"><span class="k">預期影響</span><span class="v">${esc(c.impact)}</span></div>`:''}
      ${c.risk?`<div class="op-row risk"><span class="k">風險注意</span><span class="v">${esc(c.risk)}</span></div>`:''}
    </div>`;
  }).join('');
}
function pttHourlyBar(hourly){
  if(!hourly||!hourly.length) return '';
  const max=Math.max(...hourly.map(h=>h.n),1);
  return `<div class="pp-bars">${hourly.map(h=>`<div class="pp-bar" title="${esc(h.h)}時 推噓 ${h.n} 則"><div class="pp-fill" style="height:${Math.max(6,Math.round(h.n/max*100))}%"></div><div class="pp-lbl">${esc((h.h||'').slice(-2))}</div></div>`).join('')}</div><div class="pp-axis">逐小時推文量（看火力集中在發文後第幾小時）</div>`;
}
function renderPttPulse(pp){
  if(!pp) return '';
  const sigTag=t=>t==='推'?'🟢 推':t==='噓'?'🔴 噓':'⚪ →';
  const sams=(pp.samples||[]).map(s=>`<div class="cm-row"><div class="cm-meta">${sigTag(s.tag)} <b>${esc(s.uid)}</b> · ${esc(s.time)}</div><div class="cm-text">${esc(s.text)}</div></div>`).join('');
  return `<div style="margin-top:12px;border-top:1px solid #2a335f;padding-top:10px">
    <div class="sec-title" style="font-size:13px">🔥 PTT 鄉民熱度 <span class="hint">${pp.n_articles} 篇 · 推噓比＝共識方向 · 逐小時＝燒起來速度</span></div>
    <div class="pp-stats"><span class="pp-up">推 ${pp.push}</span><span class="pp-down">噓 ${pp.boo}</span><span class="pp-arrow">→ ${pp.arrow}</span>${pp.ratio!=null?`<span class="pp-ratio">推噓比 ${pp.ratio}:1${pp.ratio>=3?'（一面倒）':(pp.ratio<1?'（負評為主）':'')}</span>`:''}${pp.peak_hour?`<span class="pp-peak">爆文高峰 ${esc(pp.peak_hour)}時</span>`:''}</div>
    ${pttHourlyBar(pp.hourly)}
    ${sams?`<details class="cm-details"><summary>▼ 代表推文（最熱文 ${(pp.samples||[]).length} 則）${pp.top_title?'：'+esc(pp.top_title):''}</summary><div class="cm-list">${sams}</div></details>`:''}
  </div>`;
}
function playbookHtml(e){
  const pb=e.playbook||{};
  const cols=[['⚡ 黃金 4 小時（引爆當天）','immediate'],['🕐 24 小時內','short'],['📅 1-3 天','mid'],['🗡 反擊線（被動才用）','counter'],['🛡 預防與預警','prevention']];
  const play=cols.map(([t,k])=>pb[k]&&pb[k].length?`<div class="play-col"><h4>${t}</h4>${renderCards(pb[k])}</div>`:'').join('');
  const notes=(pb.notes||[]).map(n=>`<div class="note-box"><b>📌 本案實證</b>　${esc(n)}</div>`).join('');
  return `<div class="play-grid">${play}</div>${notes}`;
}
function newsTable(items){
  return `<table><tr><th>時間</th><th>媒體</th><th>燈</th><th>標題</th></tr>${items.map(it=>`<tr><td style="white-space:nowrap">${esc(it.time)}</td><td>${esc(it.outlet)}</td><td class="sev-${esc(it.sev)}">${esc((it.sev||'').slice(0,1))||'—'}</td><td>${it.link?`<a class="tl" href="${esc(it.link)}" target="_blank" rel="noopener">${esc(it.title)} ↗</a>`:esc(it.title)}</td></tr>`).join('')}</table>`;
}
function chainExpand(e,n){
  const ph=e.phases||{},ig=e.ignition_detail||{},fp=e.fingerprint||{},amp=e.amplifiers||{};
  if(n===1){
    const dn=e.daily_news||[]; if(!dn.length) return '';
    return `<div class="cx"><div class="cx-h">📅 逐日報導 — 點各天展開當天新聞（附連結）</div>${dn.map(d=>`<details class="cx-day"><summary>${esc(d.date.slice(5))}　${d.n} 篇（🔴 ${d.red}）</summary>${newsTable(d.items)}</details>`).join('')}</div>`;
  }
  if(n===2){
    return `<div class="cx"><div class="cx-h">📖 這些數字代表什麼</div><ul class="cx-ul">
      <li><b>${ph.burst}× 倍率</b>＝引爆日聲量是前 3 日平均的 ${ph.burst} 倍。${ph.burst>=5?'屬<b style="color:var(--red)">突發爆炸型</b>：一天內炸開、非緩慢累積，黃金回應窗極短（僅引爆當天上午）。':'屬漸進升溫，反應時間相對充裕。'}</li>
      <li><b>高峰日 ${(ph.peak||'').slice(5)}</b>＝聲量最大、媒體最密集、輿論壓力最高的一天，通常是首長必須表態的關鍵時點。</li>
      <li><b>實際影響</b>：引爆越陡，媒體框架定型越快（24-48h 內）。一旦「冷血/不作為」這類框架被當成事實傳開，翻轉成本將大增 — 這就是為何 ${ph.burst}× 代表「回應要快」。</li></ul></div>`;
  }
  if(n===3){
    const fm=e.first_movers||[]; if(!fm.length) return '';
    return `<div class="cx"><div class="cx-h">📰 第一批報導（誰先點火，附連結）</div>${newsTable(fm.map(f=>({time:f.time,outlet:f.outlet,sev:f.sev,title:f.title,link:f.link})))}</div>`;
  }
  if(n===4){
    const hhi=((fp.indicators||[]).find(i=>(i.name||'').includes('集中'))||{}).value||'—';
    return `<div class="cx"><div class="cx-h">📖 各指標的白話解釋（指標推斷，非定論）</div><ul class="cx-ul">
      <li><b>操作指紋 ${fp.score} 分</b>（0–100）：越高越像「有組織推動」而非自然新聞。&lt;38＝自然發酵、38–60＝媒體議程推動、≥60＝高度協同跡象 → 本案判為「${esc(fp.label)}」。</li>
      <li><b>同稿率 ${Math.round((ig.copy_rate||0)*100)}%</b>：引爆日報導裡「重複/通稿」的比例。高（&gt;30%）＝有通稿散播痕跡；低＝各家各自採寫。</li>

function sparkline(series,w,h){
  const max=Math.max(...series.map(s=>s.n),1);
  const bw=Math.max(2,Math.floor(w/series.length)-1);
  let x=0,bars='';
  for(const s of series){
    const bh=Math.max(1,Math.round(s.n/max*(h-2)));
    const frac=s.n?{r:s.red/s.n,y:s.yellow/s.n}:{r:0,y:0};
    const col=frac.r>=.4?'var(--red)':(frac.r+frac.y>=.5?'var(--yel)':'#44508a');
    bars+=`<rect x="${x}" y="${h-bh}" width="${bw}" height="${bh}" fill="${col}" rx="1"/>`;
    x+=bw+1;
  }
  return `<svg class="spark" width="${x}" height="${h}" viewBox="0 0 ${x} ${h}">${bars}</svg>`;
}

function lifeChart(e){
  const S=e.series; if(!S.length) return '';
  const W=Math.max(560,Math.min(860,S.length*26)),H=190,PB=34,PL=30,PT=14;
  const max=Math.max(...S.map(s=>s.n),1);
  const cmax=Math.max(...S.map(s=>s.c_n),1);
  const bw=Math.max(5,Math.floor((W-PL-8)/S.length)-3);
  let g='',x=PL;
  const pos={};
  for(const s of S){
    const total=s.n, bh=Math.round(total/max*(H-PB-PT));
    let y=H-PB;
    for(const [k,col] of [['green','var(--grn)'],['yellow','var(--yel)'],['red','var(--red)']]){
      const hh=total?Math.round(s[k]/total*bh):0;
      if(hh>0){y-=hh;g+=`<rect x="${x}" y="${y}" width="${bw}" height="${hh}" fill="${col}" opacity=".9" rx="1"><title>${s.date} ${k==='red'?'紅':k==='yellow'?'黃':'綠'} ${s[k]} 篇</title></rect>`;}
    }
    if(bh===0)g+=`<rect x="${x}" y="${H-PB-1}" width="${bw}" height="1" fill="#2a335f"/>`;
    pos[s.date]=x+bw/2;
    if(S.length<=20||S.indexOf(s)%Math.ceil(S.length/14)===0)
      g+=`<text x="${x+bw/2}" y="${H-PB+12}" font-size="9" fill="var(--dim)" text-anchor="middle">${s.date.slice(5)}</text>`;
    x+=bw+3;
  }
  // 留言折線
  let pts='';
  x=PL;
  for(const s of S){pts+=`${pos[s.date]},${H-PB-(s.c_n/cmax*(H-PB-PT))*0.92} `;}
  if(S.some(s=>s.c_n>0))g+=`<polyline points="${pts}" fill="none" stroke="#c084fc" stroke-width="1.6" stroke-dasharray="3 2" opacity=".9"/>`;
  // 階段標記
  const mark=(date,label,col)=>{const px=pos[date];if(px==null)return'';
    return `<line x1="${px}" y1="${PT-4}" x2="${px}" y2="${H-PB}" stroke="${col}" stroke-width="1" stroke-dasharray="2 2"/>
            <text x="${px}" y="${PT-2}" font-size="9.5" fill="${col}" text-anchor="middle" font-weight="700">${label}</text>`;};
  g+=mark(e.phases.ignition,'🔥引爆','var(--red)');
  if(e.phases.peak!==e.phases.ignition)g+=mark(e.phases.peak,'高峰','var(--yel)');
  if(e.phases.reversal)g+=mark(e.phases.reversal.date,'⏪逆轉','var(--grn)');
  g+=`<text x="${PL}" y="${H-2}" font-size="9.5" fill="var(--dim)">█紅 █黃 █綠＝每日報導（堆疊）　- - 紫線＝社群留言量</text>`;
  return `<svg width="100%" viewBox="0 0 ${W} ${H}" style="max-width:${W}px">${g}</svg>`;
}

  // 手冊
  const cols=[['⚡ 黃金 4 小時（引爆當天）','immediate'],['🕐 24 小時內','short'],['📅 1-3 天','mid'],['🗡 反擊線（被動才用）','counter'],['🛡 預防與預警','prevention']];
  const play=cols.map(([t,k])=>pb[k]&&pb[k].length?`<div class="play-col"><h4>${t}</h4>${renderCards(pb[k])}</div>`:'').join('');
  const notes=(pb.notes||[]).map(n=>`<div class="note-box"><b>📌 本案實證</b>　${esc(n)}</div>`).join('');
  // 放大層（節目/論壇）
  const amp=e.amplifiers||{yt_total:0,ptt_total:0,yt:[],ptt:[]};
  const ampWhy=h=>h&&h.length?`<div class="amp-why">✓ 命中錨點：${h.map(esc).join('、')}</div>`:'';
  const ampRows=[
    ...amp.yt.map(v=>`<tr><td style="white-space:nowrap">${esc(v.date)}</td><td>📺 ${esc(v.author)}</td>
      <td style="white-space:nowrap">${v.views!=null?'👁 '+Number(v.views).toLocaleString():'—'}</td>
      <td><a class="tl" href="${esc(v.url)}" target="_blank" rel="noopener">${esc(v.title)} ↗</a>${ampWhy(v.hit)}${v.why?`<div class="amp-snip">相關內容：「${esc(v.why)}」</div>`:''}</td></tr>`),
    ...amp.ptt.map(p=>`<tr><td style="white-space:nowrap">${esc(p.date)}</td><td>💬 ${esc(p.author||'PTT')}</td>
      <td style="white-space:nowrap">推 ${p.push!=null?p.push:'—'}</td>
      <td><a class="tl" href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)} ↗</a>${ampWhy(p.hit)}</td></tr>`)
  ].join('');
  const ampPanel=(amp.yt_total+amp.ptt_total)>0?`
    <div class="sub-panel">
      <div class="sec-title">📺 節目／論壇放大層 <span class="hint">政論財經節目 ${amp.yt_total} 部・PTT ${amp.ptt_total} 篇（已精準比對，附命中錨點）</span></div>
      <table><tr><th>日期</th><th>來源</th><th>熱度</th><th>內容（附命中原因）</th></tr>${ampRows}</table>
      ${renderPttPulse(amp.ptt_pulse)}
      <div style="font-size:11.5px;color:var(--dim);margin-top:8px">「命中錨點」＝該則為何被歸到本事件（事件專屬詞）；節目談論＝事件被「放大/定調」的節點。YouTube 字幕逐秒定位為下一步（僅約一成影片有官方字幕）。</div>
    </div>`:`
    <div class="sub-panel">
      <div class="sec-title">📺 節目／論壇放大層</div>
      <div class="empty">經精準比對（事件專屬錨點＋城市閘），本事件期間未偵測到「確實相關」的政論節目或 PTT 高熱度討論。<br>（已排除僅靠通用詞誤配的內容；放大層自 2026-06-12 起採集，更早的事件無回溯資料。）</div>
    </div>`;
  // 社群留言實況（最早一篇 + 燒起來敘述 + 可展開代表留言）
  const sigIcon=s=>s==='red'?'🔴':s==='yellow'?'🟡':s==='green'?'🟢':'⚪';
  const cmRow=c=>`<div class="cm-row"><div class="cm-meta">${sigIcon(c.sig)} <b>${esc(c.author)}</b> · ${esc(c.plat)} · ${esc(c.time)}</div><div class="cm-text">${esc(c.text)}</div></div>`;
  const ear=cp.earliest;
  const commentsPanel=cp.c_total>0?`
    <div class="sub-panel" style="margin-top:14px">
      <div class="sec-title">💬 社群留言實況 <span class="hint">FB/IG/Threads 留言 ${cp.c_total} 則 — 最早一篇 → 怎麼燒起來 → 代表留言</span></div>
      ${cp.narrative?`<div class="cm-narr">🔥 怎麼燒起來：${esc(cp.narrative)}</div>`:''}
      ${ear?`<div class="cm-earliest"><span class="tag">最早一篇</span> ${sigIcon(ear.sig)} <b>${esc(ear.author)}</b> · ${esc(ear.plat)} · ${esc(ear.time)}<div class="cm-text">${esc(ear.text)}</div></div>`:''}
      ${(cp.samples&&cp.samples.length)?`<details class="cm-details"><summary>▼ 點擊展開代表留言（紅燈優先，共 ${cp.samples.length} 則）</summary><div class="cm-list">${cp.samples.map(cmRow).join('')}</div></details>`:''}
      <div style="font-size:11px;color:var(--dim);margin-top:8px">⚠️ 留言目前<b>無單則原文連結</b>（資料源未存 permalink，需抓取端補），故只能呈現內容、無法點回原貼文；互動數（讚/回覆）亦缺，「帶動力」以每日留言量＋紅燈占比近似。</div>
    </div>`:`
    <div class="sub-panel" style="margin-top:14px">
      <div class="sec-title">💬 社群留言實況</div>
      <div class="empty">經精準比對（事件專屬錨點＋城市閘），本事件期間無確實相關的 FB/IG/Threads 留言。</div>
    </div>`;
  // 樣本
  const samples=e.samples.map(s=>`<tr><td style="white-space:nowrap">${esc(s.time)}</td>
    <td>${esc(s.outlet)}</td><td class="sev-${esc(s.sev)}">${esc(s.sev).slice(0,1)||'—'}</td>
    <td>${s.link?`<a class="tl" href="${esc(s.link)}" target="_blank" rel="noopener">${esc(s.title)} ↗</a>`:esc(s.title)}</td></tr>`).join('');

  $('detail').innerHTML=`
  <div class="det-head"><h2>${esc(e.name)}</h2>
    <span class="chip topic">${esc(e.topic)}</span>
    <span class="chip fp-${esc(fp.label)}">${esc(fp.label)} ${fp.score}</span></div>
  <div class="statline">
    <span>期間 <b>${e.date_start} ～ ${e.date_end}</b></span>
    <span>獨立報導 <b>${e.n_total}</b> 篇（<b class="sev-紅燈">紅 ${e.n_red}</b>／<b class="sev-黃燈">黃 ${e.n_yellow}</b>）${e.n_raw>e.n_total?`，含轉載觸及 <b>${e.n_raw}</b> 筆`:''}</span>
    <span>社群留言 <b>${cp.c_total}</b> 則</span>
    <span>關鍵詞 <b>${e.keywords.join('・')}</b></span>
  </div>
  ${phaseBar}
  ${lifeChart(e)}
  ${renderChain(e)}
  <div class="grid2">
    <div class="sub-panel">
      <div class="sec-title">🔥 引爆解構 <span class="hint">誰點的火、火怎麼燒起來</span></div>
      <table><tr><th>時間</th><th>媒體</th><th>燈</th><th>第一批報導（按時間）</th></tr>${fm}</table>
      <div class="kv"><span>引爆日同稿率（${ig.n} 篇 / ${ig.uniq_titles} 個獨立標題）</span><b>${Math.round(ig.copy_rate*100)}%</b></div>
      <div class="kv"><span>引爆日 3 小時集中度</span><b>${ig.dense3?Math.round(ig.dense3*100)+'%':'樣本不足'}</b></div>
      <div class="kv"><span>夜間（22-06時）發稿比</span><b>${Math.round(ig.night*100)}%</b></div>
      ${hh}
    </div>
    <div class="sub-panel">
      <div class="sec-title">🧬 操作指紋 <span class="hint">指標推斷，非定論</span></div>
      <div class="gauge"><span class="num" style="color:${fp.score>=60?'var(--red)':fp.score>=38?'var(--yel)':'var(--grn)'}">${fp.score}</span>
        <div><div class="lbl">${esc(fp.label)}</div><div class="desc">${esc(fp.desc)}</div></div></div>
      ${indic}
    </div>
    <div class="sub-panel">
      <div class="sec-title">📡 跨平台脈動 <span class="hint">誰先燒：社群 vs 媒體</span></div>
      <div style="font-size:13px;margin-bottom:8px">${esc(cp.verdict)}</div>
      ${cp.narrative?`<div class="cm-narr" style="margin-bottom:8px">🔥 ${esc(cp.narrative)}</div>`:''}
      <div class="kv"><span>事件相關留言總數</span><b>${cp.c_total} 則</b></div>
      ${cp.c_red_peak!=null?`<div class="kv"><span>高峰日留言紅燈占比</span><b class="sev-紅燈">${Math.round(cp.c_red_peak*100)}%</b></div>`:''}
      <div style="font-size:11.5px;color:var(--dim);margin-top:8px">紫色虛線（上圖）＝社群留言量走勢，與新聞量對照可見「先後與帶動關係」。完整留言見下方「💬 社群留言實況」。</div>
    </div>
    <div class="sub-panel">
      <div class="sec-title">📰 媒體光譜與集中度 <span class="hint">誰在報、誰報最多</span></div>
      ${leanBar}${outlets}
    </div>
    ${ampPanel}
  </div>
  ${commentsPanel}
  <div style="margin-top:14px"><div class="sec-title">📎 引爆日代表報導</div>
    <table><tr><th>時間</th><th>媒體</th><th>燈</th><th>標題</th></tr>${samples}</table></div>`;
}
</script>
</body>
</html>
